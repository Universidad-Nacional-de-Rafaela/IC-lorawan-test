# Broker del banco LoRaWAN.
# Sin TLS ni autenticación: solo escucha en la red interna de Docker y en
# 127.0.0.1 de la notebook (ver los ports del compose). No exponer a internet.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
